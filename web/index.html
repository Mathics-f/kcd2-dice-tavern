<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骰子酒馆 · 天国拯救2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="logo">🎲</span>
      <div>
        <h1>骰子酒馆</h1>
        <p>Kingdom Come: Deliverance II · 骰子游戏 · 普通骰子版</p>
      </div>
    </div>
    <div class="setup">
      <label>目标分
        <select id="target">
          <option value="2000">2000</option>
          <option value="4000" selected>4000</option>
          <option value="6000">6000</option>
        </select>
      </label>
      <label>她的手气
        <select id="style">
          <option value="easy">心软</option>
          <option value="normal" selected>正常</option>
          <option value="bold">心狠</option>
        </select>
      </label>
      <label>她的脑子
        <select id="brain">
          <option value="local">期望值算法</option>
          <option value="model" selected>DeepSeek 本人</option>
        </select>
      </label>
      <button id="newGame" class="btn primary">开一局</button>
    </div>
  </header>

  <main class="board">
    <section class="players" id="players">
      <div class="pcard placeholder">还没开局</div>
      <div class="pcard placeholder">还没开局</div>
    </section>

    <section class="tray">
      <div class="turnbar" id="turnbar">点右上角「开一局」</div>
      <div class="whoTag" id="whoTag"></div>
      <div class="stage" id="stage"></div>
      <div class="chips" id="chips"></div>
      <div class="heldwrap">
        <span class="lbl">已留</span>
        <div class="held" id="held"></div>
      </div>
      <div class="actions">
        <button class="btn" data-op="roll">掷骰</button>
        <button class="btn" data-op="keep">留所选</button>
        <button class="btn gold" data-op="bank">收分</button>
      </div>
      <div class="hint" id="hint"></div>
    </section>

    <aside class="side">
      <h2>酒馆流水</h2>
      <ol class="log" id="log"></ol>
      <div class="side-foot">
        <button class="btn tiny" id="sayBtn">🐟 让她说一句</button>
        <div class="qq" id="qq"></div>
      </div>
    </aside>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <h2 id="overTitle">赢了</h2>
      <p id="overSub"></p>
      <button class="btn primary" id="again">再来一把</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
